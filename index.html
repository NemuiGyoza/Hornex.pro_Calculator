<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hornex Craft Calculator</title>
    <style>
        :root {
            --bg-main: #0c0f12;          /* Deep dark slate */
            --bg-card: rgba(22, 28, 36, 0.85); /* Semi-transparent container */
            --bg-input: #0d1116;         
            --primary: #9be1fb;          /* Ice teal/celestial blue accent from planet */
            --primary-hover: #6cbcdb;    
            --accent-green: #00ffaa;     
            --text-main: #c9d1d9;        
            --text-light: #f0f6fc;       
            --border-color: rgba(69, 162, 158, 0.25); 
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            position: relative;
        }

        /* Fixed background image set to 20% opacity */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://files.catbox.moe/c1spe8.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.20;
            z-index: -1;
            pointer-events: none;
        }

        .container {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            max-width: 480px;
            width: 100%;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
            backdrop-filter: blur(8px); /* Subtle frosted glass integration */
        }

        h1 {
            text-align: center;
            color: var(--text-light);
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(155, 225, 251, 0.2);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #8b949e;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select, input[type="number"] {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background-color: var(--bg-input);
            color: var(--text-light);
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        select:focus, input:focus {
            border-color: var(--primary);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: #0b0c10;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:active {
            transform: scale(0.99);
        }

        .result-box {
            margin-top: 30px;
            padding: 20px;
            background-color: rgba(13, 17, 22, 0.9);
            border-radius: 8px;
            border-left: 4px solid var(--primary);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: none;
        }

        .result-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 15px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
            padding-bottom: 6px;
        }

        .stat-line:last-of-type {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .stat-val {
            color: var(--text-light);
            font-weight: 700;
            font-family: monospace;
            font-size: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Hornex Simulator</h1>
    
    <div class="form-group">
        <label for="recipe">Target Recipe:</label>
        <select id="recipe">
            <option value="super">5 Ultra ➔ 1 Super (1% Chance)</option>
            <option value="hyper">5 Super ➔ 1 Hyper (0.51% Chance)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="budget">Total Base Petals:</label>
        <input type="number" id="budget" min="5" value="50">
    </div>

    <button class="btn" onclick="calculatePreciseCraft()">Calculate</button>

    <div class="result-box" id="resultBox">
        <div class="result-title">Analysis</div>
        
        <div class="stat-line">
            <span>Chance per Roll:</span>
            <span class="stat-val" id="rawChance">--</span>
        </div>
        <div class="stat-line">
            <span>Avg Petals Lost on Fail:</span>
            <span class="stat-val">2.5 petals</span>
        </div>
        <div class="stat-line">
            <span>Expected Cost per Success:</span>
            <span class="stat-val" id="expectedCost">--</span>
        </div>
        <div class="stat-line">
            <span>Max Budget Rolls:</span>
            <span class="stat-val" id="maxRolls">--</span>
        </div>
        <div class="stat-line">
            <span>Overall Success Chance:</span>
            <span class="stat-val" id="overallSuccess" style="color: var(--accent-green);">--</span>
        </div>
    </div>
</div>

<script>
    function calculatePreciseCraft() {
        const recipe = document.getElementById('recipe').value;
        const budget = parseInt(document.getElementById('budget').value);
        
        const p = recipe === 'super' ? 0.01 : 0.0051; 
        const avgLossOnFailure = 2.5; 

        const expectedNetCost = 5 + ((1 - p) / p) * avgLossOnFailure;

        let maxRolls = 0;
        if (budget >= 5) {
            maxRolls = 1 + Math.floor((budget - 5) / avgLossOnFailure);
        }

        const cumulativeFailureChance = Math.pow(1 - p, maxRolls);
        const totalSuccessChance = (1 - cumulativeFailureChance) * 100;

        document.getElementById('rawChance').innerText = `${(p * 100).toFixed(2)}%`;
        document.getElementById('expectedCost').innerText = `${Math.ceil(expectedNetCost)} ${recipe === 'super' ? 'Ultras' : 'Supers'}`;
        document.getElementById('maxRolls').innerText = `${maxRolls} rolls`;
        document.getElementById('overallSuccess').innerText = `${totalSuccessChance.toFixed(2)}%`;
        
        document.getElementById('resultBox').style.display = 'block';
    }
</script>

</body>
</html>
