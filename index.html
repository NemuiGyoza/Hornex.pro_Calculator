<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hornex Calculator</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        :root {
            --bg-main: #0c0f12;
            --bg-card: rgba(22, 28, 36, 0.85);
            --bg-input: #0d1116;
            --primary: #9be1fb;
            --primary-hover: #6cbcdb;
            --accent-green: #00ffaa;
            --text-main: #c9d1d9;
            --text-light: #f0f6fc;
            --border-color: rgba(69, 162, 158, 0.25);
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://files.catbox.moe/c1spe8.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.20;
            z-index: -1;
            pointer-events: none;
        }

        .container {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            max-width: 520px;
            width: 100%;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(8px);
        }

        h1 {
            text-align: center;
            color: var(--text-light);
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(155, 225, 251, 0.2);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #8b949e;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select,
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background-color: var(--bg-input);
            color: var(--text-light);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus,
        input:focus {
            border-color: var(--primary);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: #0b0c10;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:active {
            transform: scale(0.99);
        }

        .result-box {
            margin-top: 30px;
            padding: 20px;
            background-color: rgba(13, 17, 22, 0.9);
            border-radius: 8px;
            border-left: 4px solid var(--primary);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: none;
        }

        .result-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 15px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
            padding-bottom: 6px;
        }

        .stat-line:last-of-type {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .stat-val {
            color: var(--text-light);
            font-weight: 700;
            font-family: monospace;
            font-size: 15px;
        }

        /* GRAPH */

        .chart-box {
            margin-top: 28px;
        }

        .chart-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 18px;
        }

        .chart {
            width: 100%;
        }

        .chart-row {
            display: grid;
            grid-template-columns: 48px 1fr 72px;
            align-items: center;
            gap: 8px;
            margin-bottom: 9px;
        }

        .chart-label {
            color: #8b949e;
            font-size: 12px;
            text-align: right;
            white-space: nowrap;
        }

        .bar-area {
            position: relative;
            height: 24px;
            background:
                repeating-linear-gradient(
                    to right,
                    rgba(255, 255, 255, 0.08) 0,
                    rgba(255, 255, 255, 0.08) 1px,
                    transparent 1px,
                    transparent 20%
                );
            border-radius: 4px;
            overflow: hidden;
        }

        .bar {
            height: 100%;
            min-width: 0;
            background: var(--primary);
            border-radius: 4px;
            transition: width 0.4s ease;
        }

        .chart-value {
            color: var(--text-light);
            font-family: monospace;
            font-size: 12px;
            font-weight: 600;
            text-align: left;
        }

        .scale {
            display: flex;
            justify-content: space-between;
            margin-left: 56px;
            margin-right: 72px;
            margin-top: 4px;
            color: #68717c;
            font-size: 10px;
            font-family: monospace;
        }

        .chart-note {
            text-align: center;
            color: #68717c;
            font-size: 11px;
            margin-top: 14px;
        }

        @media (max-width: 520px) {
            body {
                padding: 25px 12px;
            }

            .container {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Hornex Calculator</h1>

    <div class="form-group">
        <label for="recipe">Rarity:</label>

        <select id="recipe" onchange="updateInputLabel()">
            <option value="super">Ultra → Super (1% Chance)</option>
            <option value="hyper">Super → Hyper (0.51% Chance)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="budget" id="inputLabel">
            Total Petals (Ultras):
        </label>

        <input
            type="number"
            id="budget"
            min="0"
            value="50"
        >
    </div>

    <button class="btn" onclick="calculatePreciseCraft()">
        Calculate
    </button>

    <div class="result-box" id="resultBox">

        <div class="result-title">
            Analysis
        </div>

        <div class="stat-line">
            <span>Craft Chance:</span>
            <span class="stat-val" id="rawChance">--</span>
        </div>

        <div class="stat-line">
            <span>Avg Petals Lost on Fail:</span>
            <span class="stat-val" id="lossText">--</span>
        </div>

        <div class="stat-line">
            <span>Expected Cost per Success:</span>
            <span class="stat-val" id="expectedCost">--</span>
        </div>

        <div class="stat-line">
            <span>Max Budget Rolls:</span>
            <span class="stat-val" id="maxRolls">--</span>
        </div>

        <div class="stat-line">
            <span>Success Chance:</span>
            <span
                class="stat-val"
                id="overallSuccess"
                style="color: var(--accent-green);"
            >
                --
            </span>
        </div>


        <!-- GRAPH -->

        <div class="chart-box">

            <div class="chart-title">
                Chance of Each Result
            </div>

            <div class="chart" id="chart"></div>

            <div class="scale">
                <span>0%</span>
                <span>25%</span>
                <span>50%</span>
                <span>75%</span>
                <span>100%</span>
            </div>

            <div class="chart-note">
                Based on your max rolls
            </div>

        </div>

    </div>

</div>


<script>

function updateInputLabel() {

    const recipe =
        document.getElementById('recipe').value;

    const inputLabel =
        document.getElementById('inputLabel');

    if (recipe === 'super') {

        inputLabel.innerText =
            "Total Petals (Ultras):";

    } else {

        inputLabel.innerText =
            "Total Petals (Supers):";

    }
}


function calculatePreciseCraft() {

    const recipe =
        document.getElementById('recipe').value;

    const budget =
        parseInt(
            document.getElementById('budget').value
        ) || 0;


    /*
        Craft chances
    */

    const p =
        recipe === 'super'
            ? 0.01
            : 0.0051;


    /*
        Average petals lost when a
        craft fails.
    */

    const avgLossOnFailure = 2.5;


    /*
        Expected cost
    */

    const expectedNetCost =
        5 +
        ((1 - p) / p) *
        avgLossOnFailure;


    /*
        Maximum number of rolls
    */

    let maxRolls = 0;

    if (budget >= 5) {

        maxRolls =
            1 +
            Math.floor(
                (budget - 5) /
                avgLossOnFailure
            );

    }


    /*
        Chance of at least one success
    */

    const totalSuccessChance =
        maxRolls > 0
            ? (
                1 -
                Math.pow(
                    1 - p,
                    maxRolls
                )
            ) * 100
            : 0;


    /*
        Units
    */

    const unit =
        recipe === 'super'
            ? 'Ultras'
            : 'Supers';


    /*
        Update results
    */

    document.getElementById('rawChance').innerText =
        `${(p * 100).toFixed(2)}%`;


    document.getElementById('lossText').innerText =
        `2.5 ${unit}`;


    document.getElementById('expectedCost').innerText =
        `${Math.ceil(expectedNetCost)} ${unit}`;


    document.getElementById('maxRolls').innerText =
        `${maxRolls} rolls`;


    document.getElementById('overallSuccess').innerText =
        `${totalSuccessChance.toFixed(2)}%`;


    /*
        Create probability graph
    */

    createProbabilityGraph(
        maxRolls,
        p,
        recipe
    );


    document.getElementById('resultBox')
        .style.display = 'block';
}


/*
    Calculate:
    
    P(k successes) =
    C(n,k) × p^k × (1-p)^(n-k)
*/

function combination(n, k) {

    if (k === 0 || k === n) {
        return 1;
    }

    k =
        Math.min(
            k,
            n - k
        );

    let result = 1;

    for (let i = 1; i <= k; i++) {

        result =
            result *
            (n - i + 1) /
            i;

    }

    return result;
}


function createProbabilityGraph(
    rolls,
    chance,
    recipe
) {

    const chart =
        document.getElementById('chart');

    chart.innerHTML = '';


    if (rolls <= 0) {

        chart.innerHTML = `
            <div style="
                text-align:center;
                color:#68717c;
                font-size:12px;
            ">
                Not enough petals for a roll.
            </div>
        `;

        return;
    }


    /*
        Calculate every possible result.
    */

    let results = [];

    for (
        let successes = 0;
        successes <= rolls;
        successes++
    ) {

        const probability =
            combination(
                rolls,
                successes
            ) *
            Math.pow(
                chance,
                successes
            ) *
            Math.pow(
                1 - chance,
                rolls - successes
            ) *
            100;


        results.push({
            successes,
            probability
        });

    }


    /*
        Don't create hundreds of bars
        for very large budgets.

        Keep results that have at least
        0.01% chance.
    */

    let visible =
        results.filter(
            result =>
                result.probability >= 0.01
        );


    /*
        If the budget is extremely large,
        limit the graph to the most useful
        range around the peak.
    */

    if (visible.length > 25) {

        const highest =
            Math.max(
                ...visible.map(
                    r => r.probability
                )
            );

        visible =
            visible.filter(
                result =>
                    result.probability >=
                    highest * 0.001
            );

    }


    /*
        Always keep 0 successes visible.
    */

    if (
        !visible.some(
            result =>
                result.successes === 0
        )
    ) {

        visible.unshift(
            results[0]
        );

    }


    /*
        Find the highest probability.

        The graph scales to this instead
        of always forcing the bars into
        a 0-100% range.
    */

    const highestProbability =
        Math.max(
            ...visible.map(
                result =>
                    result.probability
            )
        );


    /*
        Create graph rows.
    */

    visible.forEach(result => {

        const row =
            document.createElement('div');

        row.className =
            'chart-row';


        const label =
            document.createElement('div');

        label.className =
            'chart-label';


        const reward =
            recipe === 'super'
                ? 'Super'
                : 'Hyper';


        label.innerText =
            `${result.successes} ${reward}`;


        const barArea =
            document.createElement('div');

        barArea.className =
            'bar-area';


        const bar =
            document.createElement('div');

        bar.className =
            'bar';


        /*
            Scale relative to the largest
            probability.

            This means even a 2.94%
            chance can be seen clearly.
        */

        let width =
            highestProbability > 0
                ? (
                    result.probability /
                    highestProbability
                ) * 100
                : 0;


        /*
            Tiny probabilities still
            get a small visible bar.
        */

        if (
            result.probability > 0 &&
            width < 2
        ) {
            width = 2;
        }


        bar.style.width =
            `${width}%`;


        barArea.appendChild(bar);


        const value =
            document.createElement('div');

        value.className =
            'chart-value';


        /*
            More decimals for very
            small probabilities.
        */

        if (result.probability < 0.01) {

            value.innerText =
                `${result.probability.toFixed(4)}%`;

        } else {

            value.innerText =
                `${result.probability.toFixed(2)}%`;

        }


        row.appendChild(label);
        row.appendChild(barArea);
        row.appendChild(value);

        chart.appendChild(row);

    });

}

</script>

</body>
</html>
