<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hornex Calc</title>

    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        :root {
            --bg-main: #0c0f12;
            --bg-card: rgba(22, 28, 36, 0.85);
            --bg-input: #0d1116;
            --primary: #9be1fb;
            --primary-hover: #6cbcdb;
            --accent-green: #00ffaa;
            --text-main: #c9d1d9;
            --text-light: #f0f6fc;
            --border-color: rgba(69, 162, 158, 0.25);
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 60px 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: url('https://files.catbox.moe/c1spe8.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.20;
            z-index: -1;
            pointer-events: none;
        }

        .container {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            max-width: 520px;
            width: 100%;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(8px);
        }

        h1 {
            text-align: center;
            color: var(--text-light);
            margin: 0 0 25px;
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #8b949e;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select,
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background-color: var(--bg-input);
            color: var(--text-light);
            font-size: 15px;
            outline: none;
        }

        select:focus,
        input:focus {
            border-color: var(--primary);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: #0b0c10;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .result-box {
            margin-top: 30px;
            padding: 20px;
            background-color: rgba(13, 17, 22, 0.9);
            border-radius: 8px;
            border-left: 4px solid var(--primary);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: none;
        }

        .result-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 15px;
            text-align: center;
            text-transform: uppercase;
        }

        .stat-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
            padding-bottom: 6px;
        }

        .stat-line:last-of-type {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .stat-val {
            color: var(--text-light);
            font-weight: 700;
            font-family: monospace;
            font-size: 15px;
        }

        /* GRAPH */

        .chart-box {
            margin-top: 25px;
        }

        .chart-title {
            text-align: center;
            color: var(--primary);
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .bar {
            display: flex;
            align-items: center;
            margin-bottom: 9px;
            gap: 8px;
        }

        .bar-label {
            width: 55px;
            text-align: right;
            font-size: 12px;
            color: #8b949e;
        }

        .bar-bg {
            flex: 1;
            height: 22px;
            background: #0a0d11;
            border-radius: 4px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 4px;
            transition: width 0.4s ease;
        }

        .bar-value {
            width: 65px;
            font-size: 12px;
            font-family: monospace;
            color: var(--text-light);
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Hornex Calc</h1>

    <div class="form-group">
        <label for="recipe">Type:</label>

        <select id="recipe" onchange="updateInputLabel()">
            <option value="super">5 U → 1 S (1%)</option>
            <option value="hyper">5 S → 1 H (0.51%)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="budget" id="inputLabel">Petals (U):</label>

        <input
            type="number"
            id="budget"
            min="0"
            value="50"
        >
    </div>

    <button class="btn" onclick="calculate()">Calc</button>

    <div class="result-box" id="resultBox">

        <div class="result-title">Results</div>

        <div class="stat-line">
            <span>Roll Chance</span>
            <span class="stat-val" id="rawChance">--</span>
        </div>

        <div class="stat-line">
            <span>Avg Loss</span>
            <span class="stat-val" id="lossText">--</span>
        </div>

        <div class="stat-line">
            <span>Avg Cost</span>
            <span class="stat-val" id="expectedCost">--</span>
        </div>

        <div class="stat-line">
            <span>Max Rolls</span>
            <span class="stat-val" id="maxRolls">--</span>
        </div>

        <div class="stat-line">
            <span>Win Chance</span>
            <span
                class="stat-val"
                id="overallSuccess"
                style="color: var(--accent-green);"
            >
                --
            </span>
        </div>

        <!-- GRAPH -->

        <div class="chart-box">

            <div class="chart-title">
                Chance per Result
            </div>

            <div id="chart"></div>

        </div>

    </div>

</div>

<script>

function updateInputLabel() {

    const recipe =
        document.getElementById('recipe').value;

    const label =
        document.getElementById('inputLabel');

    if (recipe === 'super') {
        label.innerText = "Petals (U):";
    } else {
        label.innerText = "Petals (S):";
    }
}


function calculate() {

    const recipe =
        document.getElementById('recipe').value;

    const budget =
        parseInt(document.getElementById('budget').value) || 0;

    const p =
        recipe === 'super'
            ? 0.01
            : 0.0051;

    const avgLoss = 2.5;

    const unit =
        recipe === 'super'
            ? 'U'
            : 'S';

    const reward =
        recipe === 'super'
            ? 'S'
            : 'H';


    /*
        Expected cost
    */

    const expectedCost =
        5 + ((1 - p) / p) * avgLoss;


    /*
        Max rolls
    */

    let maxRolls = 0;

    if (budget >= 5) {

        maxRolls =
            1 +
            Math.floor(
                (budget - 5) / avgLoss
            );

    }


    /*
        Overall chance of at least 1 success
    */

    const totalSuccessChance =
        maxRolls > 0
            ? (1 - Math.pow(1 - p, maxRolls)) * 100
            : 0;


    /*
        Update results
    */

    document.getElementById('rawChance').innerText =
        `${(p * 100).toFixed(2)}%`;

    document.getElementById('lossText').innerText =
        `2.5 ${unit}`;

    document.getElementById('expectedCost').innerText =
        `${Math.ceil(expectedCost)} ${unit}`;

    document.getElementById('maxRolls').innerText =
        `${maxRolls}`;

    document.getElementById('overallSuccess').innerText =
        `${totalSuccessChance.toFixed(2)}%`;


    /*
        Create graph
    */

    createChart(
        maxRolls,
        p,
        reward
    );


    document.getElementById('resultBox')
        .style.display = 'block';
}


function createChart(
    rolls,
    chance,
    reward
) {

    const chart =
        document.getElementById('chart');

    chart.innerHTML = '';


    if (rolls === 0) {

        chart.innerHTML =
            '<div style="text-align:center;color:#8b949e;">No rolls</div>';

        return;
    }


    /*
        Binomial probability:

        P(k successes) =
        C(n,k) × p^k × (1-p)^(n-k)
    */

    function combination(n, k) {

        let result = 1;

        for (let i = 1; i <= k; i++) {

            result =
                result *
                (n - i + 1) /
                i;

        }

        return result;
    }


    const results = [];


    for (let k = 0; k <= rolls; k++) {

        const probability =
            combination(rolls, k) *
            Math.pow(chance, k) *
            Math.pow(1 - chance, rolls - k);

        results.push({
            amount: k,
            probability: probability * 100
        });

    }


    /*
        Only show useful results.

        This prevents huge budgets
        from making the graph enormous.
    */

    let visible = results.filter(
        r => r.probability >= 0.01
    );


    /*
        Always show at least 0 + 1.
    */

    if (visible.length === 0) {
        visible = results.slice(0, 2);
    }


    const maxProbability =
        Math.max(
            ...visible.map(r => r.probability)
        );


    visible.forEach(result => {

        const row =
            document.createElement('div');

        row.className = 'bar';


        const label =
            document.createElement('div');

        label.className = 'bar-label';

        label.innerText =
            `${result.amount} ${reward}`;


        const bg =
            document.createElement('div');

        bg.className = 'bar-bg';


        const fill =
            document.createElement('div');

        fill.className = 'bar-fill';


        /*
            Minimum width makes tiny
            probabilities still visible.
        */

        const width =
            result.probability === 0
                ? 0
                : Math.max(
                    2,
                    (result.probability / maxProbability) * 100
                );


        fill.style.width =
            `${width}%`;


        bg.appendChild(fill);


        const value =
            document.createElement('div');

        value.className = 'bar-value';

        value.innerText =
            `${result.probability.toFixed(2)}%`;


        row.appendChild(label);
        row.appendChild(bg);
        row.appendChild(value);

        chart.appendChild(row);

    });

}

</script>

</body>
</html>
