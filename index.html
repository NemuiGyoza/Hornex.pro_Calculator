<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hornex Ultra/Super Precision Craft Calculator</title>
    <style>
        /* Modern CSS variables for easy styling updates */
        :root {
            --bg-main: #0a0c10;          /* Deep futuristic dark background */
            --bg-card: #161b22;          /* Sleek container color */
            --bg-input: #0d1117;         /* Dark contrast input fields */
            --primary: #ffaa00;          /* Signature vibrant gold */
            --primary-hover: #e59900;    /* Darker gold for buttons on hover */
            --accent-green: #00ffaa;     /* Neon green for high success stats */
            --text-main: #c9d1d9;        /* Soft readable text */
            --text-light: #f0f6fc;       /* Bright text for headings/values */
            --border-color: #30363d;     /* Minimalist borders */
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--bg-card);
            border-radius: 16px;
            padding: 35px;
            /* Creates a clean glow effect around the calculator */
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 2px rgba(255, 170, 0, 0.15);
            max-width: 520px;
            width: 100%;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            color: var(--text-light);
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            /* Subtle text glow for a high-tier feel */
            text-shadow: 0 0 10px rgba(255, 170, 0, 0.3);
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #8b949e;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select, input[type="number"] {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 2px solid var(--border-color);
            background-color: var(--bg-input);
            color: var(--text-light);
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        /* Gold highlight when fields are clicked */
        select:focus, input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 8px rgba(255, 170, 0, 0.2);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            background-color: var(--primary);
            color: var(--bg-main);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .result-box {
            margin-top: 35px;
            padding: 25px;
            background-color: var(--bg-input);
            border-radius: 12px;
            border-left: 4px solid var(--primary);
            border-top: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            display: none;
        }

        .result-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 20px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            font-size: 15px;
            border-bottom: 1px dashed rgba(48, 54, 61, 0.6);
            padding-bottom: 8px;
        }

        .stat-line:last-of-type {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .stat-val {
            color: var(--text-light);
            font-weight: 700;
            font-family: monospace;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Hornex High-Tier Simulator</h1>
    
    <div class="form-group">
        <label for="recipe">Target Recipe (From 5 Items):</label>
        <select id="recipe">
            <option value="super">5 Ultra ➔ 1 Super (1% Chance)</option>
            <option value="hyper">5 Super ➔ 1 Hyper (0.51% Chance)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="budget">How many base petals do you have total?</label>
        <input type="number" id="budget" min="5" value="50">
    </div>

    <button class="btn" onclick="calculatePreciseCraft()">Calculate True Probabilities</button>

    <div class="result-box" id="resultBox">
        <div class="result-title">Mathematical Analysis</div>
        
        <div class="stat-line">
            <span>Raw Success Chance per Roll:</span>
            <span class="stat-val" id="rawChance">--</span>
        </div>
        <div class="stat-line">
            <span>Average Petals Lost on Failure:</span>
            <span class="stat-val">2.5 petals</span>
        </div>
        <div class="stat-line">
            <span>Expected Cost per Success:</span>
            <span class="stat-val" id="expectedCost">--</span>
        </div>
        <div class="stat-line">
            <span>Max Rolls with Your Budget:</span>
            <span class="stat-val" id="maxRolls">--</span>
        </div>
        <div class="stat-line">
            <span>Your Overall Probability of Success:</span>
            <span class="stat-val" id="overallSuccess" style="color: var(--accent-green);">--</span>
        </div>
    </div>
</div>

<script>
    function calculatePreciseCraft() {
        const recipe = document.getElementById('recipe').value;
        const budget = parseInt(document.getElementById('budget').value);
        
        const p = recipe === 'super' ? 0.01 : 0.0051; 
        const avgLossOnFailure = 2.5; 

        const expectedNetCost = 5 + ((1 - p) / p) * avgLossOnFailure;

        let maxRolls = 0;
        if (budget >= 5) {
            maxRolls = 1 + Math.floor((budget - 5) / avgLossOnFailure);
        }

        const cumulativeFailureChance = Math.pow(1 - p, maxRolls);
        const totalSuccessChance = (1 - cumulativeFailureChance) * 100;

        document.getElementById('rawChance').innerText = `${(p * 100).toFixed(2)}%`;
        document.getElementById('expectedCost').innerText = `${Math.ceil(expectedNetCost)} ${recipe === 'super' ? 'Ultras' : 'Supers'}`;
        document.getElementById('maxRolls').innerText = `${maxRolls} attempts`;
        document.getElementById('overallSuccess').innerText = `${totalSuccessChance.toFixed(2)}%`;
        
        document.getElementById('resultBox').style.display = 'block';
    }
</script>

</body>
</html>
